<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stillframe</title>
  </head>
  <body>
    <!-- ENCABEZADO -->
    <header>
      <h1>Stillframe</h1>
      <nav>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Tendencias</a></li>
          <li><a href="#">Recomendadas</a></li>
          <li><a href="#">Iniciar sesión</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- HERO SECTION -->
      <section class="hero">
        <h2>¿Que pelicula viste hoy?</h2>
        <p>Contanos que escenas no te podes sacar de la cabeza</p>

        <form>
          <label for="busqueda-pelicula">Buscar película:</label>
          <input
            type="text"
            id="busqueda-pelicula"
            name="busqueda-pelicula"
            placeholder="Ej. Titanic, El Padrino..."
          />
          <button type="submit">Buscar</button>
        </form>
      </section>

      <!-- SECCION DE PELICULAS EN TRENDING -->
      <section class="trending-peliculas">
        <h2>Películas en tendencia</h2>
        <div>
          <!-- Aquí se mostrarán las películas en tendencia -->
        </div>
      </section>

      <!-- SECCION DE PELICULAS RECOMENDADAS (SOLO CON LOGIN)-->
      <section class="recomendadas-peliculas">
        <h2>Películas recomendadas</h2>
        <div>
          <!-- Aquí se mostrarán las películas recomendadas -->
        </div>
      </section>

      <!-- SECCION ULTMAS RESEÑAS-->
      <section class="ultimas-resenas">
        <h2>Últimas reseñas</h2>
        <div>
          <!-- Aquí se mostrarán las últimas reseñas -->
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Stillframe. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
