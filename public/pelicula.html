<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotograma - Película</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Google Fonts Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Hoja de estilos de la aplicación -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- NAVEGACIÓN PRINCIPAL / ENCABEZADO SUPERIOR -->
    <header
      class="navbar navbar-dark bg-dark-custom sticky-top border-bottom border-dark-subtle px-3 px-md-4 py-2"
    >
      <div
        class="container-fluid d-flex align-items-center justify-content-between gap-2"
      >
        <!-- Identidad visual y activador del menú lateral (Oculto por defecto si no hay sesión iniciada) -->
        <div class="d-flex align-items-center gap-3">
          <button
            id="btn-menu-offcanvas"
            class="btn btn-menu-toggle d-none align-items-center justify-content-center"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#asideDesplegable"
            aria-controls="asideDesplegable"
            aria-label="Abrir menú de usuario"
          >
            <i class="bi bi-list fs-4"></i>
          </button>
          <a
            class="navbar-brand fw-bold m-0 d-flex align-items-center gap-2"
            href="index.html"
          >
            <span class="logo-icon"></span> Fotograma<span class="text-success"
              >.</span
            >
          </a>
        </div>

        <!-- Buscador Global -->
        <form
          id="form-busqueda"
          class="d-flex flex-grow-1 max-w-search mx-2 mx-md-4"
        >
          <div class="input-group">
            <input
              type="search"
              id="busqueda-pelicula"
              name="q"
              class="form-control bg-dark text-white border-secondary rounded-start-pill ps-3"
              placeholder="Buscar película..."
              aria-label="Buscar película"
              required
            />
            <button class="btn btn-success rounded-end-pill px-3" type="submit">
              <i class="bi bi-search"></i>
              <span class="d-none d-md-inline ms-1">Buscar</span>
            </button>
          </div>
        </form>

        <!-- Botón dinámico de acceso/perfil de usuario -->
        <div class="d-flex align-items-center">
          <a
            id="btn-auth-action"
            href="login.html"
            class="btn btn-sm btn-success rounded-pill px-3 fw-medium"
          >
            <i class="bi bi-person-fill me-1"></i>
            <span id="auth-btn-text">Iniciar sesión</span>
          </a>
        </div>
      </div>
    </header>

    <!-- MENÚ LATERAL DESPLEGABLE (ASIDE) - Exclusivo para usuarios con sesión -->
    <aside
      class="offcanvas offcanvas-start bg-sidebar text-white border-end border-dark-subtle"
      tabindex="-1"
      id="asideDesplegable"
      aria-labelledby="asideDesplegableLabel"
    >
      <div class="offcanvas-header border-bottom border-dark-subtle p-3">
        <h5
          class="offcanvas-title fw-bold text-white d-flex align-items-center gap-2"
          id="asideDesplegableLabel"
        >
          <span class="logo-icon"></span> Fotograma<span class="text-success"
            >.</span
          >
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Cerrar menú"
        ></button>
      </div>

      <div
        class="offcanvas-body d-flex flex-column justify-content-between p-4"
      >
        <nav>
          <ul class="nav flex-column gap-2 p-0 fs-6">
            <li class="nav-item">
              <a
                href="perfil.html"
                class="nav-link text-white rounded d-flex align-items-center gap-3"
              >
                <i class="bi bi-person-circle"></i> Perfil
              </a>
            </li>
            <li class="nav-item">
              <a
                href="perfil.html#watchlists"
                class="nav-link text-secondary rounded d-flex align-items-center gap-3"
              >
                <i class="bi bi-bookmark-heart"></i> Watchlist
              </a>
            </li>
            <li class="nav-item">
              <a
                href="perfil.html#reviews"
                class="nav-link text-secondary rounded d-flex align-items-center gap-3"
              >
                <i class="bi bi-chat-square-text"></i> Reviews
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer pt-3 border-top border-dark-subtle">
          <button
            id="btn-logout"
            class="btn btn-link nav-link text-danger w-100 text-start rounded d-flex align-items-center gap-3 fs-6 p-2 text-decoration-none"
          >
            <i class="bi bi-box-arrow-left"></i> Logout
          </button>
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="container-fluid max-w-content py-4 px-3 px-md-5">
      <!-- SECCIÓN HERO: FOTOGRAMA / BACKDROP DEL FILM (Boceto: Hero Fotograma del Film) -->
      <section class="movie-backdrop-section mb-4">
        <div
          id="backdrop-container"
          class="movie-backdrop-hero rounded-4 overflow-hidden border border-dark-subtle position-relative shadow d-flex align-items-end p-4"
        >
          <div
            class="spinner-border text-success mx-auto my-5"
            role="status"
            id="backdrop-spinner"
          ></div>
        </div>
      </section>

      <!-- DETALLE DE LA PELÍCULA (Boceto: Póster + Géneros a la Izquierda | Información a la Derecha) -->
      <section class="movie-details-section mb-5">
        <div class="row g-4">
          <!-- COLUMNA IZQUIERDA: PÓSTER Y GÉNEROS -->
          <div class="col-12 col-md-4 col-lg-3 text-center text-md-start">
            <div class="poster-container mb-3 shadow rounded-3">
              <img
                id="movie-poster"
                src=""
                alt=""
                class="img-fluid rounded-3 d-none"
              />
              <div id="poster-placeholder" class="py-5 text-secondary">
                <i class="bi bi-film display-1 d-block mb-2"></i>
              </div>
            </div>

            <!-- GÉNEROS DE LA PELÍCULA -->
            <div
              id="movie-genres"
              class="d-flex flex-wrap gap-2 justify-content-center justify-content-md-start"
            >
              <!-- Inyectado dinámicamente desde la API -->
            </div>
          </div>

          <!-- COLUMNA DERECHA: TÍTULO, RATING, DESCRIPCIÓN, ACTORES Y RESEÑAS -->
          <div class="col-12 col-md-8 col-lg-9">
            <!-- FILA SUPERIOR: TÍTULO (AÑO) + RATING Y BOTÓN AGREGAR RESEÑA -->
            <div
              class="d-flex flex-column flex-sm-row justify-content-between align-items-start gap-3 border-bottom border-dark-subtle pb-3 mb-4"
            >
              <div>
                <h1 id="movie-title" class="display-6 text-white fw-bold m-0">
                  <!-- Título (Año) -->
                </h1>
              </div>

              <!-- RATING Y ACCIÓN DE RESEÑAR -->
              <div class="text-sm-end">
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="text-warning fs-5">★</span>
                  <span
                    id="movie-rating"
                    class="h5 text-white fw-bold m-0"
                  ></span>
                </div>
                <button
                  id="btn-add-review"
                  class="btn btn-sm btn-success rounded-pill px-3"
                >
                  <i class="bi bi-pencil-square me-1"></i> Agregar Reseña
                </button>
              </div>
            </div>

            <!-- DESCRIPCIÓN / OVERVIEW -->
            <div class="mb-4">
              <h2 class="h6 text-success fw-bold text-uppercase micro-text">
                Sinopsis / Descripción
              </h2>
              <p
                id="movie-description"
                class="text-secondary leading-relaxed mb-0"
              >
                <!-- Inyectado desde JS -->
              </p>
            </div>

            <hr class="border-dark-subtle my-4" />

            <!-- 3 ACTORES (REPARTO PRINCIPAL) -->
            <div class="mb-4">
              <h2
                class="h6 text-success fw-bold text-uppercase micro-text mb-3"
              >
                3 Actores Principales
              </h2>
              <div id="cast-container" class="row g-3" aria-live="polite">
                <!-- Inyectado desde la API -->
              </div>
            </div>

            <hr class="border-dark-subtle my-4" />

            <!-- SECCIÓN RESEÑAS DE LA PELÍCULA -->
            <div class="movie-reviews-section">
              <h2
                class="h5 text-white fw-bold mb-4 d-flex align-items-center gap-2"
              >
                <i class="bi bi-chat-left-quote text-success"></i> Reseñas
              </h2>

              <div
                id="movie-reviews-container"
                class="row g-3"
                aria-live="polite"
              >
                <div class="text-secondary py-3">Cargando reseñas...</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- FOOTER -->
      <footer
        class="py-3 d-flex flex-column flex-sm-row justify-content-between align-items-center text-secondary fs-7 gap-2 border-top border-dark-subtle my-4"
      >
        <p class="m-0">Fotograma &copy; 2026 · Hecho para mirar y recordar.</p>
        <a href="#" class="text-secondary text-decoration-none"
          >Acerca de y créditos &#x2197;</a
        >
      </footer>
    </main>

    <!-- ================================================================= -->
    <!-- PLANTILLAS HTML (<template>) PARA INYECCIÓN DINÁMICA DESDE LA API -->
    <!-- ================================================================= -->

    <!-- Plantilla de Género (Badge) -->
    <template id="tpl-genre-badge">
      <span
        class="badge bg-secondary bg-opacity-25 text-white border border-secondary px-3 py-2 rounded-pill"
      ></span>
    </template>

    <!-- Plantilla para Tarjeta de Actor -->
    <template id="tpl-cast-item">
      <div class="col-4 col-sm-4">
        <div
          class="p-2 bg-dark-custom rounded-3 border border-dark-subtle text-center"
        >
          <span
            class="actor-name fw-medium text-white d-block fs-7 text-truncate"
          ></span>
          <span
            class="character-name text-secondary micro-text d-block text-truncate"
          ></span>
        </div>
      </div>
    </template>

    <!-- Plantilla de Tarjeta de Reseña de Película -->
    <template id="tpl-movie-review-card">
      <div class="col-12">
        <div class="review-card p-3 rounded-3">
          <div class="d-flex align-items-center gap-2 mb-2">
            <div class="author-avatar user-avatar-sm rounded-circle"></div>
            <span class="author-name text-white fw-semibold fs-7"></span>
            <div class="stars-rating text-warning fs-7 ms-2"></div>
            <span class="review-date text-secondary micro-text ms-auto"></span>
          </div>
          <p class="review-content text-secondary mb-0 fs-7"></p>
        </div>
      </div>
    </template>

    <!-- Scripts de Bootstrap y Cliente JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../src/app.js" type="module"></script>
  </body>
</html>
